<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>

  <style>

    /* =========================
       BASE
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }


    /* =========================
       ÉCRANS
       ========================= */

    .screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity 0.9s ease,
        transform 1.1s cubic-bezier(.22,.61,.36,1);
    }


    /* =========================
       ACCUEIL
       ========================= */

    #accueil {
      z-index: 2;

      cursor: pointer;

      background: #eee2cf;
    }

    #accueil .house {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       INTÉRIEUR
       ========================= */

    #interieur {
      z-index: 1;

      opacity: 0;

      transform: scale(1.025);

      pointer-events: none;

      background: #eee2cf;
    }


    /* Fond flouté intérieur
       TEMPORAIRE */

    #interieur .background {
      position: absolute;

      inset: -40px;

      width: calc(100% + 80px);
      height: calc(100% + 80px);

      object-fit: cover;

      filter:
        blur(28px)
        brightness(.93)
        saturate(.85);

      transform: scale(1.08);

      opacity: .65;
    }


    #interieur .veil {
      position: absolute;
      inset: 0;

      background:
        rgba(244, 235, 220, .24);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      z-index: 1;
    }


    #interieur .house {
      position: relative;

      z-index: 2;

      width: 97%;
      height: 97%;

      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       TRANSITION
       ========================= */

    body.inside #accueil {
      opacity: 0;

      transform: scale(1.035);

      pointer-events: none;
    }


    body.inside #interieur {
      opacity: 1;

      transform: scale(1);

      pointer-events: auto;
    }


    /* =========================
       BOUTON RETOUR
       ========================= */

    .retour {
      position: absolute;

      z-index: 10;

      top:
        max(
          18px,
          calc(env(safe-area-inset-top) + 8px)
        );

      left:
        max(
          18px,
          calc(env(safe-area-inset-left) + 8px)
        );

      padding: 11px 17px;

      border: 0;

      border-radius: 999px;

      background:
        rgba(255, 255, 255, .86);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 14px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, .13);
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      /*
        Temporaire :
        on utilise encore l'image desktop.

        La véritable illustration mobile
        viendra ensuite.
      */

      #accueil .house {
        object-fit: cover;
        object-position: center center;
      }


      #interieur .house {
        width: 96%;
        height: 96%;
      }

    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 769px) {

      #accueil .house {
        object-fit: cover;
        object-position: center center;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       ACCUEIL NEIZH
       ========================= -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="mmaison-accueil-desktop.1.png"
      alt="NEIZH"
    >

  </section>



  <!-- =========================
       MAISON EN COUPE
       ========================= -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="background"
      src="maison-interieur.webp"
      alt=""
    >

    <div class="veil"></div>


    <img
      class="house"
      src="maison-interieur.webp"
      alt="Intérieur de NEIZH"
    >


    <button
      class="retour"
      id="retour"
      type="button"
    >
      ← Dehors
    </button>

  </section>



  <!-- =========================
       INTERACTIONS
       ========================= -->

  <script>

    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");


    /*
      Clic sur l'accueil :
      ouverture de la maison
    */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );


    /*
      Retour à l'extérieur
    */

    retour.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        document.body
          .classList
          .remove("inside");

      }
    );

  </script>


</body>

</html>
