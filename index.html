<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>


  <style>

    /* ==================================================
       BASE
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }



    /* ==================================================
       ÉCRANS
       ================================================== */

    .screen {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;

      transition: opacity .7s ease;
    }



    /* ==================================================
       IMAGES PRINCIPALES
       ================================================== */

    .house {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }



    /* ==================================================
       MAISON EXTÉRIEURE
       ================================================== */

    #accueil {
      z-index: 3;

      opacity: 1;

      pointer-events: auto;

      cursor: pointer;
    }



    /* ==================================================
       MAISON INTÉRIEURE
       ================================================== */

    #interieur {
      z-index: 2;
    }



    /* ==================================================
       PASSAGE EXTÉRIEUR → INTÉRIEUR
       ================================================== */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }



    /* ==================================================
       BOUTON SORTIR
       ================================================== */

    .sortir {
      position: absolute;

      z-index: 50;

      left: 50%;
      bottom: 4.5%;

      transform: translateX(-50%);

      padding: 14px 34px;

      border: 0;

      border-radius: 999px;

      background:
        rgba(250, 247, 240, .96);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 17px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, .12);

      transition:
        transform .2s ease,
        background .2s ease;
    }


    .sortir:hover {
      background: white;

      transform:
        translateX(-50%)
        translateY(-2px);
    }



    /* ==================================================
       HOTSPOTS DES PIÈCES
       ================================================== */

    .hotspot {
      position: absolute;

      z-index: 30;

      border: 0;

      padding: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 18px;

      box-shadow: none;

      transition:
        background .25s ease,
        box-shadow .25s ease;
    }



    /* ==================================================
       SURVOL D'UNE PIÈCE
       ================================================== */

    .hotspot:hover {
      background:
        rgba(255, 220, 130, .25);

      box-shadow:

        inset 0 0 0 2px
        rgba(255, 255, 255, .72),

        0 0 30px
        rgba(255, 190, 75, .45);
    }



    /* ==================================================
       NOM DE LA PIÈCE
       ================================================== */

    .room-name {
      position: absolute;

      left: 50%;
      bottom: 14px;

      transform:
        translateX(-50%)
        translateY(8px);

      padding:
        9px 16px;

      border-radius:
        999px;

      background:
        rgba(67, 55, 43, .92);

      color:
        white;

      font-family:
        Georgia, serif;

      font-size:
        16px;

      white-space:
        nowrap;

      opacity:
        0;

      pointer-events:
        none;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, .20);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }


    .hotspot:hover .room-name {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }



    /* ==================================================
       BIBLIOTHÈQUE
       HOTSPOT VALIDÉ
       ================================================== */

    #bibliotheque-hotspot {
      left: 45%;

      top: 28%;

      width: 13%;

      height: 25%;
    }



    /* ==================================================
       ÉCRAN BIBLIOTHÈQUE
       ================================================== */

    #bibliotheque {
      z-index: 5;

      background: #eee2cf;
    }


    body.library-open #bibliotheque {
      opacity: 1;

      pointer-events: auto;
    }


    body.library-open #interieur {
      opacity: 0;

      pointer-events: none;
    }



    /* ==================================================
       IMAGE BIBLIOTHÈQUE
       ================================================== */

    .library-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position:
        center center;

      user-select: none;

      -webkit-user-drag: none;
    }



    /* ==================================================
       NOX
       ================================================== */

    #nox-stage {
      position: absolute;

      inset: 0;

      z-index: 25;

      overflow: hidden;

      pointer-events: none;
    }


    #nox {
      position: absolute;

      width: clamp(85px, 7.5vw, 135px);

      height: auto;

      left: -12%;

      bottom: 18%;

      opacity: 0;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;

      transform-origin: center bottom;

      filter:
        drop-shadow(
          0 7px 7px
          rgba(60, 40, 25, .16)
        );
    }



    /* ==================================================
       RETOUR À LA MAISON
       ================================================== */

    .retour-maison {
      position: absolute;

      z-index: 50;

      left: 50%;

      bottom: 4.5%;

      transform:
        translateX(-50%);

      padding:
        14px 28px;

      border: 0;

      border-radius:
        999px;

      background:
        rgba(250, 247, 240, .96);

      color:
        #514737;

      font-family:
        Georgia, serif;

      font-size:
        17px;

      cursor:
        pointer;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, .12);

      transition:
        transform .2s ease,
        background .2s ease;
    }


    .retour-maison:hover {
      background:
        white;

      transform:
        translateX(-50%)
        translateY(-2px);
    }



    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 768px) {

      .sortir,
      .retour-maison {
        font-size: 14px;

        padding:
          11px 20px;
      }


      .room-name {
        font-size:
          14px;

        padding:
          8px 13px;
      }


      /*
        Pour le moment, animation Nox desktop.
        On fera ensuite une version mobile adaptée.
      */

      #nox-stage {
        display: none;
      }

    }

  </style>

</head>



<body>


  <!-- ==================================================
       MAISON EXTÉRIEURE
       ================================================== -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.3.png"
      alt="NEIZH"
    >

  </section>



  <!-- ==================================================
       MAISON INTÉRIEURE
       ================================================== -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="house"
      src="maison-interieur.3.png.png"
      alt="Intérieur de NEIZH"
    >



    <!-- ================================================
         BIBLIOTHÈQUE
         ================================================ -->

    <button
      id="bibliotheque-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la bibliothèque"
    >

      <span class="room-name">
        Bibliothèque
      </span>

    </button>



    <!-- ================================================
         SORTIR DE NEIZH
         ================================================ -->

    <button
      id="sortir"
      class="sortir"
      type="button"
    >

      Sortir

    </button>


  </section>



  <!-- ==================================================
       VUE DÉTAILLÉE BIBLIOTHÈQUE
       ================================================== -->

  <section
    id="bibliotheque"
    class="screen"
  >

    <img
      class="library-image"
      src="Bibliothèque_interieur1.png"
      alt="Bibliothèque de NEIZH"
    >



    <!-- ================================================
         NOX
         ================================================ -->

    <div id="nox-stage">

      <img
        id="nox"
        src="1.MARCHE1_NOX.png"
        alt=""
        aria-hidden="true"
      >

    </div>



    <button
      id="retour-maison"
      class="retour-maison"
      type="button"
    >

      ← Retour à la maison

    </button>


  </section>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    /* ==================================================
       ÉLÉMENTS
       ================================================== */

    const accueil =
      document.getElementById(
        "accueil"
      );


    const sortir =
      document.getElementById(
        "sortir"
      );


    const bibliotheque =
      document.getElementById(
        "bibliotheque-hotspot"
      );


    const retourMaison =
      document.getElementById(
        "retour-maison"
      );


    const nox =
      document.getElementById(
        "nox"
      );



    /* ==================================================
       PRÉCHARGEMENT DES IMAGES DE NOX
       ================================================== */

    const noxImages = [
      "1.MARCHE1_NOX.png",
      "2.MARCHE2_NOX.png",
      "3.MARCHE3_NOX.png",
      "4.MARCHE4_NOX.png",
      "5.MARCHE5_NOX.png"
    ];


    noxImages.forEach(
      function (src) {

        const image =
          new Image();

        image.src = src;

      }
    );



    /* ==================================================
       PETITE FONCTION D'ATTENTE
       ================================================== */

    function attendre(ms) {

      return new Promise(
        function (resolve) {

          setTimeout(
            resolve,
            ms
          );

        }
      );

    }



    /* ==================================================
       GESTION DE L'ANIMATION NOX
       ================================================== */

    let animationNoxId = 0;


    function stopperNox() {

      animationNoxId++;


      nox
        .getAnimations()
        .forEach(
          function (animation) {

            animation.cancel();

          }
        );


      nox.style.opacity = "0";

      nox.style.left = "-12%";

      nox.style.bottom = "18%";

      nox.style.transform = "none";

      nox.src = "1.MARCHE1_NOX.png";

    }



    async function jouerAnimationNox() {

      /*
        Chaque lancement reçoit son propre numéro.
        Si on quitte la bibliothèque, le numéro
        change et l'animation s'arrête.
      */

      const monAnimationId =
        ++animationNoxId;



      function animationToujoursActive() {

        return (
          monAnimationId ===
          animationNoxId
        );

      }



      /* ----------------------------------------------
         1. NOX ENTRE À GAUCHE
         ---------------------------------------------- */

      nox.src =
        "1.MARCHE1_NOX.png";

      nox.style.opacity =
        "1";

      nox.style.left =
        "-10%";

      nox.style.bottom =
        "18%";

      nox.style.transform =
        "none";


      await attendre(300);


      if (!animationToujoursActive()) {
        return;
      }



      /* ----------------------------------------------
         2. NOX MARCHE JUSQU'AU FAUTEUIL
         ---------------------------------------------- */

      const marche =
        nox.animate(

          [

            {
              left: "-10%",
              bottom: "18%",
              transform:
                "translateY(0)"
            },

            {
              left: "-2%",
              bottom: "18%",
              transform:
                "translateY(-4px)"
            },

            {
              left: "7%",
              bottom: "18%",
              transform:
                "translateY(0)"
            },

            {
              left: "15%",
              bottom: "18%",
              transform:
                "translateY(-4px)"
            },

            {
              left: "23%",
              bottom: "18%",
              transform:
                "translateY(0)"
            },

            {
              left: "30%",
              bottom: "18%",
              transform:
                "translateY(-3px)"
            }

          ],

          {
            duration: 4200,

            easing: "linear",

            fill: "forwards"
          }

        );


      await marche.finished;


      if (!animationToujoursActive()) {
        return;
      }


      nox.style.left =
        "30%";

      nox.style.bottom =
        "18%";

      nox.style.transform =
        "none";



      /* ----------------------------------------------
         3. NOX S'ARRÊTE ET REGARDE
         ---------------------------------------------- */

      nox.src =
        "4.MARCHE4_NOX.png";


      await attendre(1300);


      if (!animationToujoursActive()) {
        return;
      }



      /* ----------------------------------------------
         4. NOX SAUTE SUR LE FAUTEUIL
         ---------------------------------------------- */

      nox.src =
        "nox-saut.png";


      await attendre(120);


      if (!animationToujoursActive()) {
        return;
      }


      const saut =
        nox.animate(

          [

            {
              left: "30%",
              bottom: "18%",

              transform:
                "rotate(-4deg) scale(.96)"
            },

            {
              left: "34%",
              bottom: "35%",

              transform:
                "rotate(-1deg) scale(1)"
            },

            {
              left: "38.5%",
              bottom: "29.5%",

              transform:
                "rotate(2deg) scale(.96)"
            }

          ],

          {
            duration: 1050,

            easing:
              "cubic-bezier(.35,.05,.30,1)",

            fill: "forwards"
          }

        );


      await saut.finished;


      if (!animationToujoursActive()) {
        return;
      }



      /* ----------------------------------------------
         5. NOX ASSISE SUR LE FAUTEUIL
         ---------------------------------------------- */

      nox.src =
        "nox-assise.png";

      nox.style.left =
        "38.5%";

      nox.style.bottom =
        "29.5%";

      nox.style.transform =
        "none";


      await attendre(1800);


      if (!animationToujoursActive()) {
        return;
      }



      /* ----------------------------------------------
         6. NOX S'ALLONGE ET DORT
         ---------------------------------------------- */

      nox.style.opacity =
        ".25";


      await attendre(150);


      if (!animationToujoursActive()) {
        return;
      }


      nox.src =
        "nox-dort.png";

      nox.style.left =
        "37.8%";

      nox.style.bottom =
        "29%";


      await attendre(80);


      if (!animationToujoursActive()) {
        return;
      }


      nox.style.opacity =
        "1";


      /*
        Fin :
        Nox reste couchée sur le fauteuil.
      */

    }



    /* ==================================================
       ENTRER DANS NEIZH
       ================================================== */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );



    /* ==================================================
       SORTIR DE NEIZH
       ================================================== */

    sortir.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        stopperNox();


        document.body
          .classList
          .remove("inside");


        document.body
          .classList
          .remove("library-open");

      }
    );



    /* ==================================================
       OUVRIR LA BIBLIOTHÈQUE
       ================================================== */

    bibliotheque.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        document.body
          .classList
          .add("library-open");


        stopperNox();


        /*
          Petit délai pour laisser la bibliothèque
          apparaître avant que Nox entre.
        */

        setTimeout(
          function () {

            jouerAnimationNox();

          },
          650
        );

      }
    );



    /* ==================================================
       RETOURNER DANS LA MAISON
       ================================================== */

    retourMaison.addEventListener(
      "click",
      function () {

        stopperNox();


        document.body
          .classList
          .remove("library-open");

      }
    );


  </script>


</body>

</html>
