<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">
  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eee2cf;
      font-family: Georgia, serif;
    }

    body {
      min-height: 100dvh;
    }

    /* ---------- ÉCRANS ---------- */

    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        opacity .9s ease,
        transform 1.1s cubic-bezier(.22,.61,.36,1);
    }

    /* ---------- IMAGE PRINCIPALE ---------- */

    .house {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 2;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---------- ACCUEIL ---------- */

    #accueil {
      z-index: 2;
      cursor: pointer;
      background: #eee2cf;
    }

    /* ---------- INTÉRIEUR ---------- */

    #interieur {
      z-index: 1;

      opacity: 0;
      transform: scale(1.025);

      pointer-events: none;
      background: #eee2cf;
    }

    body.inside #accueil {
      opacity: 0;
      transform: scale(1.035);
      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* ---------- INTÉRIEUR : FOND FLOU TEMPORAIRE ---------- */

    .background {
      position: absolute;

      inset: -40px;

      width: calc(100% + 80px);
      height: calc(100% + 80px);

      object-fit: cover;

      filter:
        blur(28px)
        brightness(.93)
        saturate(.85);

      transform: scale(1.08);

      opacity: .65;
    }

    .veil {
      position: absolute;
      inset: 0;

      background: rgba(244, 235, 220, .24);

      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);

      z-index: 1;
    }

    /* ---------- IMAGE INTÉRIEURE ---------- */

    #interieur .house {
      object-fit: contain;
      width: 97%;
      height: 97%;
      left: 1.5%;
      top: 1.5%;
      inset: auto;
    }

    /* ---------- INTERFACE ---------- */

    .ui {
      position: absolute;
      z-index: 10;
    }

    .retour {
      top:
        max(
          18px,
          calc(env(safe-area-inset-top) + 8px)
        );

      left:
        max(
          18px,
          calc(env(safe-area-inset-left) + 8px)
        );

      border: 0;

      border-radius: 999px;

      padding: 11px 17px;

      background: rgba(255,255,255,.86);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #514737;

      font-family: inherit;
      font-size: 14px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0,0,0,.13);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 768px) {

      /*
      Pour l'instant, la nouvelle créa desktop reste utilisée.
      On fabriquera ensuite une vraie version mobile dédiée.
      */

      #accueil .house {
        object-fit: cover;
        object-position: center;
      }

      #interieur .house {
        width: 96%;
        height: 96%;
        left: 2%;
        top: 2%;
      }
    }

    /* ---------- DESKTOP ---------- */

    @media (min-width: 769px) {

      #accueil .house {
        object-fit: cover;
        object-position: center;
      }
    }
  </style>
</head>

<body>

  <!-- =============================
       MAISON EXTÉRIEURE
       ============================= -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.png"
      alt="NEIZH"
    >

  </section>

  <!-- =============================
       MAISON EN COUPE
       ============================= -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="background"
      src="maison-interieur.webp"
      alt=""
    >

    <div class="veil"></div>

    <img
      class="house"
      src="maison-interieur.webp"
      alt="Intérieur de NEIZH"
    >

    <button
      class="ui retour"
      id="retour"
    >
      ← Dehors
    </button>

  </section>

  <script>
    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");

    /* Entrer dans la maison */

    accueil.addEventListener(
      "click",
      () => {
        document.body
          .classList
          .add("inside");
      }
    );

    /* Revenir dehors */

    retour.addEventListener(
      "click",
      (event) => {
        event.stopPropagation();

        document.body
          .classList
          .remove("inside");
      }
    );
  </script>

</body>
</html>
