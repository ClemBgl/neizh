<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* =========================
       ÉCRANS
       ========================= */

    .screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      transition: opacity .8s ease;
    }

    /* =========================
       IMAGES EXTÉRIEUR + INTÉRIEUR
       ========================= */

    #accueil .house,
    #interieur .house {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* =========================
       ACCUEIL
       ========================= */

    #accueil {
      z-index: 2;

      opacity: 1;

      cursor: pointer;

      pointer-events: auto;
    }

    /* =========================
       INTÉRIEUR
       ========================= */

    #interieur {
      z-index: 1;

      opacity: 0;

      pointer-events: none;
    }

    /* =========================
       PASSAGE EXTÉRIEUR -> INTÉRIEUR
       ========================= */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }

    /* =========================
       BOUTON RETOUR
       ========================= */

    .retour {
      position: absolute;

      z-index: 10;

      top:
        max(
          18px,
          calc(env(safe-area-inset-top) + 8px)
        );

      left:
        max(
          18px,
          calc(env(safe-area-inset-left) + 8px)
        );

      padding: 11px 17px;

      border: 0;

      border-radius: 999px;

      background: rgba(255,255,255,.88);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 14px;

      cursor: pointer;

      box-shadow:
        0 5px 18px rgba(0,0,0,.14);
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      #accueil .house,
      #interieur .house {
        object-fit: cover;
        object-position: center center;
      }

      .retour {
        font-size: 13px;
        padding: 10px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       MAISON EXTÉRIEURE
       ========================= -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.3.png"
      alt="NEIZH"
    >

  </section>

  <!-- =========================
       MAISON INTÉRIEURE
       ========================= -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="house"
      src="maison-interieur.3.png.png"
      alt="Intérieur de NEIZH"
    >

    <button
      class="retour"
      id="retour"
      type="button"
    >
      ← Dehors
    </button>

  </section>

  <!-- =========================
       INTERACTIONS
       ========================= -->

  <script>
    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");

    accueil.addEventListener(
      "click",
      function () {
        document.body
          .classList
          .add("inside");
      }
    );

    retour.addEventListener(
      "click",
      function (event) {
        event.stopPropagation();

        document.body
          .classList
          .remove("inside");
      }
    );
  </script>

</body>
</html>
