<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }


    /* =========================
       ÉCRANS
       ========================= */

    .screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      transition: opacity .8s ease;
    }


    /* =========================
       IMAGES
       ========================= */

    #accueil .house,
    #interieur .house {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       ACCUEIL
       ========================= */

    #accueil {
      z-index: 2;

      opacity: 1;

      cursor: pointer;

      pointer-events: auto;
    }


    /* =========================
       INTÉRIEUR
       ========================= */

    #interieur {
      z-index: 1;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       PASSAGE EXTÉRIEUR
       -> INTÉRIEUR
       ========================= */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }


    /* =========================
       BOUTON SORTIR
       ========================= */

    .retour {
      position: absolute;

      z-index: 30;

      left: 50%;
      bottom: 4.5%;

      transform: translateX(-50%);

      padding: 14px 34px;

      border: 0;

      border-radius: 999px;

      background: rgba(250, 247, 240, .96);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 17px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(0,0,0,.10);
    }

    .retour:hover {
      background: rgba(255,255,255,.98);
    }


    /* =========================
       HOTSPOTS
       ========================= */

    .hotspot {
      position: absolute;

      z-index: 20;

      border: 0;
      padding: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 16px;

      transition:
        background .25s ease,
        box-shadow .25s ease;
    }

    .hotspot:hover {
      background: rgba(255, 240, 190, .12);

      box-shadow:
        0 0 0 2px rgba(255,255,255,.20),
        0 0 30px rgba(255,210,120,.40);
    }


    /* =========================
       HOTSPOT BIBLIOTHÈQUE
       ========================= */

    #bibliotheque-hotspot {
      left: 39%;
      top: 25%;

      width: 19%;
      height: 31%;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      #accueil .house,
      #interieur .house {
        object-fit: cover;
        object-position: center center;
      }

      .retour {
        font-size: 14px;

        padding: 11px 20px;
      }

      .hotspot:hover {
        background: transparent;

        box-shadow: none;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       MAISON EXTÉRIEURE
       ========================= -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.3.png"
      alt="NEIZH"
    >

  </section>


  <!-- =========================
       MAISON INTÉRIEURE
       ========================= -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="house"
      src="maison-interieur.3.png.png"
      alt="Intérieur de NEIZH"
    >


    <!-- Zone cliquable bibliothèque -->

    <button
      id="bibliotheque-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la bibliothèque"
    ></button>


    <!-- Bouton pour sortir -->

    <button
      class="retour"
      id="retour"
      type="button"
    >
      Sortir
    </button>

  </section>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");

    const bibliotheque =
      document.getElementById("bibliotheque-hotspot");


    /* =========================
       ENTRER DANS NEIZH
       ========================= */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );


    /* =========================
       SORTIR
       ========================= */

    retour.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        document.body
          .classList
          .remove("inside");

      }
    );


    /* =========================
       BIBLIOTHÈQUE
       ========================= */

    bibliotheque.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        alert("Bienvenue dans la bibliothèque 📚");

      }
    );

  </script>


</body>
</html>
