<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f3eadb;
      font-family: Georgia, serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        opacity 1s ease,
        transform 1.2s cubic-bezier(.22,.61,.36,1);
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #accueil {
      cursor: pointer;
      z-index: 2;
    }

    #interieur {
      opacity: 0;
      transform: scale(1.04);
      pointer-events: none;
      z-index: 1;
    }

    body.inside #accueil {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .entrer {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      padding: 11px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(8px);
      color: #514737;
      font-size: 15px;
      letter-spacing: .05em;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
      transition: opacity .4s ease;
    }

    body.inside .entrer {
      opacity: 0;
    }

    .retour {
      position: absolute;
      top: 20px;
      left: 20px;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: rgba(255,255,255,.85);
      color: #514737;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
  </style>
</head>

<body>

  <div id="accueil" class="screen">
    <img src="maison-accueil.webp" alt="NEIZH">
    <div class="entrer">Entrer dans NEIZH</div>
  </div>

  <div id="interieur" class="screen">
    <img src="maison-interieur.webp" alt="Intérieur de NEIZH">
    <button class="retour" id="retour">← Dehors</button>
  </div>

  <script>
    const accueil = document.getElementById("accueil");
    const retour = document.getElementById("retour");

    accueil.addEventListener("click", () => {
      document.body.classList.add("inside");
    });

    retour.addEventListener("click", (event) => {
      event.stopPropagation();
      document.body.classList.remove("inside");
    });
  </script>

</body>
</html>
