<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }


    /* =========================
       ÉCRANS
       ========================= */

    .screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      transition: opacity .8s ease;
    }


    /* =========================
       IMAGES
       ========================= */

    #accueil .house,
    #interieur .house {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       ACCUEIL
       ========================= */

    #accueil {
      z-index: 2;

      opacity: 1;

      cursor: pointer;

      pointer-events: auto;
    }


    /* =========================
       INTÉRIEUR
       ========================= */

    #interieur {
      z-index: 1;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       PASSAGE EXTÉRIEUR
       -> INTÉRIEUR
       ========================= */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }


    /* =========================
       BOUTON SORTIR
       ========================= */

    .retour {
      position: absolute;

      z-index: 30;

      left: 50%;
      bottom: 4.5%;

      transform: translateX(-50%);

      padding: 14px 34px;

      border: 0;

      border-radius: 999px;

      background: rgba(250, 247, 240, .96);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 17px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(0,0,0,.10);
    }

    .retour:hover {
      background: rgba(255,255,255,.98);
    }


    /* =========================
   HOTSPOTS
   ========================= */

.hotspot {
  position: absolute;
  z-index: 20;

  border: 2px solid rgba(255, 255, 255, .35);
  padding: 0;

  background: rgba(255, 235, 180, .12);

  cursor: pointer;

  border-radius: 18px;

  transition:
    background .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
}

.hotspot:hover {
  background: rgba(255, 225, 150, .28);

  border-color: rgba(255, 255, 255, .75);

  box-shadow:
    0 0 0 3px rgba(255,255,255,.16),
    0 0 34px rgba(255,195,90,.55);
}


/* =========================
   NOM DE LA PIÈCE
   ========================= */

.hotspot::after {
  content: attr(data-room);

  position: absolute;

  left: 50%;
  bottom: 12px;

  transform: translateX(-50%) translateY(6px);

  padding: 8px 14px;

  border-radius: 999px;

  background: rgba(70, 57, 43, .88);

  color: white;

  font-family: Georgia, serif;
  font-size: 15px;

  white-space: nowrap;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .2s ease,
    transform .2s ease;

  box-shadow:
    0 4px 12px rgba(0,0,0,.18);
}

.hotspot:hover::after {
  opacity: 1;

  transform: translateX(-50%) translateY(0);
}


/* =========================
   BIBLIOTHÈQUE
   ========================= */

#bibliotheque-hotspot {
  left: 36%;
  top: 24%;

  width: 24%;
  height: 34%;
}


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");

    const bibliotheque =
      document.getElementById("bibliotheque-hotspot");


    /* =========================
       ENTRER DANS NEIZH
       ========================= */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );


    /* =========================
       SORTIR
       ========================= */

    retour.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        document.body
          .classList
          .remove("inside");

      }
    );


    /* =========================
       BIBLIOTHÈQUE
       ========================= */

    bibliotheque.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        alert("Bienvenue dans la bibliothèque 📚");

      }
    );

  </script>


</body>
</html>
