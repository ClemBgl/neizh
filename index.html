<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>


  <style>

    /* ==================================================
       BASE
       ================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }



    /* ==================================================
       ÉCRANS
       ================================================== */

    .screen {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;

      transition: opacity .7s ease;
    }



    /* ==================================================
       IMAGES PRINCIPALES
       ================================================== */

    .house {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }



    /* ==================================================
       MAISON EXTÉRIEURE
       ================================================== */

    #accueil {
      z-index: 3;

      opacity: 1;

      pointer-events: auto;

      cursor: pointer;
    }



    /* ==================================================
       MAISON INTÉRIEURE
       ================================================== */

    #interieur {
      z-index: 2;
    }



    /* ==================================================
       PASSAGE EXTÉRIEUR → INTÉRIEUR
       ================================================== */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }



    /* ==================================================
       BOUTON SORTIR
       ================================================== */

    .sortir {
      position: absolute;

      z-index: 50;

      left: 50%;
      bottom: 4.5%;

      transform: translateX(-50%);

      padding: 14px 34px;

      border: 0;

      border-radius: 999px;

      background:
        rgba(250, 247, 240, .96);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 17px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, .12);

      transition:
        transform .2s ease,
        background .2s ease;
    }


    .sortir:hover {
      background: white;

      transform:
        translateX(-50%)
        translateY(-2px);
    }



    /* ==================================================
       HOTSPOTS DES PIÈCES
       ================================================== */

    .hotspot {
      position: absolute;

      z-index: 30;

      border: 0;

      padding: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 18px;

      box-shadow: none;

      transition:
        background .25s ease,
        box-shadow .25s ease;
    }



    /* ==================================================
       SURVOL D'UNE PIÈCE
       ================================================== */

    .hotspot:hover {
      background:
        rgba(255, 220, 130, .25);

      box-shadow:

        inset 0 0 0 2px
        rgba(255, 255, 255, .72),

        0 0 30px
        rgba(255, 190, 75, .45);
    }



    /* ==================================================
       NOM DE LA PIÈCE
       ================================================== */

    .room-name {
      position: absolute;

      left: 50%;
      bottom: 14px;

      transform:
        translateX(-50%)
        translateY(8px);

      padding:
        9px 16px;

      border-radius:
        999px;

      background:
        rgba(67, 55, 43, .92);

      color:
        white;

      font-family:
        Georgia, serif;

      font-size:
        16px;

      white-space:
        nowrap;

      opacity:
        0;

      pointer-events:
        none;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, .20);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }


    .hotspot:hover .room-name {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }



    /* ==================================================
       HOTSPOT CABANE
       Ancien carré "Chambre des enfants"
       ================================================== */

    #cabane-hotspot {
      left: 20.55%;
      top: 28.5%;

      width: 12%;
      height: 22%;
    }



    /* ==================================================
       HOTSPOT CHAMBRE DES ENFANTS
       Premier calage
       ================================================== */

    #enfants-hotspot {
      left: 35%;
      top: 30%;

      width: 12%;
      height: 22%;
    }



    /* ==================================================
       HOTSPOT BIBLIOTHÈQUE
       VALIDÉ
       ================================================== */

    #bibliotheque-hotspot {
      left: 45%;
      top: 28%;

      width: 13%;
      height: 25%;
    }



    /* ==================================================
       ÉCRANS DES PIÈCES
       ================================================== */

    #bibliotheque,
    #chambre-enfants {
      z-index: 5;

      background: #eee2cf;
    }



    /* ==================================================
       OUVERTURE BIBLIOTHÈQUE
       ================================================== */

    body.library-open #bibliotheque {
      opacity: 1;

      pointer-events: auto;
    }


    body.library-open #interieur {
      opacity: 0;

      pointer-events: none;
    }



    /* ==================================================
       OUVERTURE CHAMBRE DES ENFANTS
       ================================================== */

    body.children-open #chambre-enfants {
      opacity: 1;

      pointer-events: auto;
    }


    body.children-open #interieur {
      opacity: 0;

      pointer-events: none;
    }



    /* ==================================================
       IMAGES DES PIÈCES
       ================================================== */

    .room-image {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position:
        center center;

      user-select: none;

      -webkit-user-drag: none;
    }



    /* ==================================================
       RETOUR À LA MAISON
       ================================================== */

    .retour-maison {
      position: absolute;

      z-index: 50;

      left: 50%;
      bottom: 4.5%;

      transform:
        translateX(-50%);

      padding:
        14px 28px;

      border: 0;

      border-radius:
        999px;

      background:
        rgba(250, 247, 240, .96);

      color:
        #514737;

      font-family:
        Georgia, serif;

      font-size:
        17px;

      cursor:
        pointer;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, .12);

      transition:
        transform .2s ease,
        background .2s ease;
    }


    .retour-maison:hover {
      background:
        white;

      transform:
        translateX(-50%)
        translateY(-2px);
    }



    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 768px) {

      .sortir,
      .retour-maison {
        font-size: 14px;

        padding:
          11px 20px;
      }


      .room-name {
        font-size: 14px;

        padding:
          8px 13px;
      }

    }

  </style>

</head>



<body>


  <!-- ==================================================
       MAISON EXTÉRIEURE
       ================================================== -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.3.png"
      alt="NEIZH"
    >

  </section>



  <!-- ==================================================
       MAISON INTÉRIEURE
       ================================================== -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="house"
      src="maison-interieur.3.png.png"
      alt="Intérieur de NEIZH"
    >



    <!-- ================================================
         CABANE
         ================================================ -->

    <button
      id="cabane-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la cabane"
    >

      <span class="room-name">
        Cabane
      </span>

    </button>



    <!-- ================================================
         CHAMBRE DES ENFANTS
         ================================================ -->

    <button
      id="enfants-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la chambre des enfants"
    >

      <span class="room-name">
        Chambre des enfants
      </span>

    </button>



    <!-- ================================================
         BIBLIOTHÈQUE
         ================================================ -->

    <button
      id="bibliotheque-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la bibliothèque"
    >

      <span class="room-name">
        Bibliothèque
      </span>

    </button>



    <!-- ================================================
         SORTIR DE NEIZH
         ================================================ -->

    <button
      id="sortir"
      class="sortir"
      type="button"
    >

      Sortir

    </button>


  </section>



  <!-- ==================================================
       VUE DÉTAILLÉE BIBLIOTHÈQUE
       ================================================== -->

  <section
    id="bibliotheque"
    class="screen"
  >

    <img
      class="room-image"
      src="Bibliothèque_interieur1.png"
      alt="Bibliothèque de NEIZH"
    >


    <button
      id="retour-bibliotheque"
      class="retour-maison"
      type="button"
    >

      ← Retour à la maison

    </button>


  </section>



  <!-- ==================================================
       VUE DÉTAILLÉE CHAMBRE DES ENFANTS
       ================================================== -->

  <section
    id="chambre-enfants"
    class="screen"
  >

    <img
      class="room-image"
      src="CHAMBRE DES ENFANTS.png"
      alt="Chambre des enfants de NEIZH"
    >


    <button
      id="retour-enfants"
      class="retour-maison"
      type="button"
    >

      ← Retour à la maison

    </button>


  </section>



  <!-- ==================================================
       JAVASCRIPT
       ================================================== -->

  <script>


    /* ==================================================
       ÉLÉMENTS
       ================================================== */

    const accueil =
      document.getElementById(
        "accueil"
      );


    const sortir =
      document.getElementById(
        "sortir"
      );


    const bibliotheque =
      document.getElementById(
        "bibliotheque-hotspot"
      );


    const chambreEnfants =
      document.getElementById(
        "enfants-hotspot"
      );


    const retourBibliotheque =
      document.getElementById(
        "retour-bibliotheque"
      );


    const retourEnfants =
      document.getElementById(
        "retour-enfants"
      );



    /* ==================================================
       ENTRER DANS NEIZH
       ================================================== */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );



    /* ==================================================
       SORTIR DE NEIZH
       ================================================== */

    sortir.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        document.body
          .classList
          .remove("inside");


        document.body
          .classList
          .remove("library-open");


        document.body
          .classList
          .remove("children-open");

      }
    );



    /* ==================================================
       OUVRIR LA BIBLIOTHÈQUE
       ================================================== */

    bibliotheque.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        document.body
          .classList
          .remove("children-open");


        document.body
          .classList
          .add("library-open");

      }
    );



    /* ==================================================
       OUVRIR LA CHAMBRE DES ENFANTS
       ================================================== */

    chambreEnfants.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();


        document.body
          .classList
          .remove("library-open");


        document.body
          .classList
          .add("children-open");

      }
    );



    /* ==================================================
       RETOUR DEPUIS LA BIBLIOTHÈQUE
       ================================================== */

    retourBibliotheque.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .remove("library-open");

      }
    );



    /* ==================================================
       RETOUR DEPUIS LA CHAMBRE DES ENFANTS
       ================================================== */

    retourEnfants.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .remove("children-open");

      }
    );


  </script>


</body>

</html>
