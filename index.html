<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#efe5d4" />

  <title>NEIZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #efe5d4;
      font-family: Georgia, serif;
    }

    body {
      min-height: 100dvh;
    }

    .screen {
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #efe5d4;
      transition:
        opacity 0.9s ease,
        transform 1.1s cubic-bezier(.22,.61,.36,1);
    }

    .image-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      transform: scale(1.01);
    }

    #accueil {
      z-index: 2;
      cursor: pointer;
    }

    #interieur {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transform: scale(1.035);
    }

    body.inside #accueil {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .ui {
      position: absolute;
      z-index: 5;
    }

    .entrer {
      left: 50%;
      bottom: max(28px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #514737;
      font-size: 15px;
      letter-spacing: .04em;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,.12);
    }

    .retour {
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: rgba(255,255,255,.84);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #514737;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.12);
    }

    body.inside .entrer {
      opacity: 0;
      pointer-events: none;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .image-layer {
        object-fit: cover;
      }

      #accueil .image-layer {
        object-position: center 48%;
      }

      #interieur .image-layer {
        object-position: center 46%;
      }

      .entrer {
        bottom: max(22px, env(safe-area-inset-bottom));
        font-size: 14px;
        padding: 11px 18px;
      }
    }

    /* DESKTOP */
    @media (min-width: 769px) {
      #accueil .image-layer {
        object-position: center 47%;
      }

      #interieur .image-layer {
        object-position: center 48%;
      }

      .entrer {
        bottom: 34px;
      }
    }

    /* ÉCRANS TRÈS LARGES */
    @media (min-aspect-ratio: 16/9) {
      .image-layer {
        transform: scale(1.04);
      }
    }
  </style>
</head>

<body>

  <section id="accueil" class="screen">
    <img
      class="image-layer"
      src="maison-accueil.webp"
      alt="Maison NEIZH"
    />
    <div class="ui entrer">Entrer dans NEIZH</div>
  </section>

  <section id="interieur" class="screen">
    <img
      class="image-layer"
      src="maison-interieur.webp"
      alt="Intérieur de NEIZH"
    />
    <button class="ui retour" id="retour">← Dehors</button>
  </section>

  <script>
    const accueil = document.getElementById("accueil");
    const retour = document.getElementById("retour");

    accueil.addEventListener("click", () => {
      document.body.classList.add("inside");
    });

    retour.addEventListener("click", (event) => {
      event.stopPropagation();
      document.body.classList.remove("inside");
    });
  </script>

</body>
</html>
