<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#eee2cf">

  <title>NEIZH</title>

  <style>

    /* =========================
       BASE
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #eee2cf;

      font-family: Georgia, serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }


    /* =========================
       ÉCRANS
       ========================= */

    .screen {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      transition: opacity .8s ease;
    }


    /* =========================
       IMAGES
       ========================= */

    #accueil .house,
    #interieur .house {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center center;

      user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       ACCUEIL
       ========================= */

    #accueil {
      z-index: 2;

      opacity: 1;

      cursor: pointer;

      pointer-events: auto;
    }


    /* =========================
       INTÉRIEUR
       ========================= */

    #interieur {
      z-index: 1;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       EXTÉRIEUR → INTÉRIEUR
       ========================= */

    body.inside #accueil {
      opacity: 0;

      pointer-events: none;
    }

    body.inside #interieur {
      opacity: 1;

      pointer-events: auto;
    }


    /* =========================
       BOUTON SORTIR
       ========================= */

    .retour {
      position: absolute;

      z-index: 50;

      left: 50%;
      bottom: 4.5%;

      transform: translateX(-50%);

      padding: 14px 34px;

      border: 0;
      border-radius: 999px;

      background: rgba(250, 247, 240, .96);

      color: #514737;

      font-family: Georgia, serif;
      font-size: 17px;

      cursor: pointer;

      box-shadow:
        0 4px 14px rgba(0, 0, 0, .12);

      transition:
        transform .2s ease,
        background .2s ease;
    }


    .retour:hover {
      background: white;

      transform:
        translateX(-50%)
        translateY(-2px);
    }


    /* =========================
       ZONES CLIQUABLES
       ========================= */

    .hotspot {
      position: absolute;

      z-index: 30;

      border: 0;
      padding: 0;

      background: transparent;

      cursor: pointer;

      border-radius: 18px;

      box-shadow: none;

      transition:
        background .25s ease,
        box-shadow .25s ease;
    }


    /* =========================
       SURVOL D'UNE PIÈCE
       ========================= */

    .hotspot:hover {
      background:
        rgba(255, 220, 130, .25);

      box-shadow:
        inset 0 0 0 2px
        rgba(255, 255, 255, .72),

        0 0 30px
        rgba(255, 190, 75, .45);
    }


    /* =========================
       NOM DE LA PIÈCE
       ========================= */

    .room-name {
      position: absolute;

      left: 50%;
      bottom: 14px;

      transform:
        translateX(-50%)
        translateY(8px);

      padding: 9px 16px;

      border-radius: 999px;

      background:
        rgba(67, 55, 43, .92);

      color: white;

      font-family: Georgia, serif;
      font-size: 16px;

      white-space: nowrap;

      opacity: 0;

      pointer-events: none;

      box-shadow:
        0 4px 14px
        rgba(0, 0, 0, .20);

      transition:
        opacity .2s ease,
        transform .2s ease;
    }


    .hotspot:hover .room-name {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================
       BIBLIOTHÈQUE
       ========================= */

    #bibliotheque-hotspot {

      /*
        Zone volontairement plus petite
        que dans la version précédente.
      */

      left: 40%;
      top: 22%;

      width: 18%;
      height: 30%;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      #accueil .house,
      #interieur .house {
        object-fit: cover;
        object-position: center center;
      }


      .retour {
        font-size: 14px;

        padding: 11px 20px;
      }


      /*
        Sur mobile il n'y a pas vraiment
        de "survol". On travaillera plus
        tard une interaction tactile dédiée.
      */

      .room-name {
        font-size: 14px;

        padding: 8px 13px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       MAISON EXTÉRIEURE
       ========================= -->

  <section
    id="accueil"
    class="screen"
  >

    <img
      class="house"
      src="maison-accueil-desktop.3.png"
      alt="NEIZH"
    >

  </section>


  <!-- =========================
       MAISON INTÉRIEURE
       ========================= -->

  <section
    id="interieur"
    class="screen"
  >

    <img
      class="house"
      src="maison-interieur.3.png.png"
      alt="Intérieur de NEIZH"
    >


    <!-- =========================
         BIBLIOTHÈQUE
         ========================= -->

    <button
      id="bibliotheque-hotspot"
      class="hotspot"
      type="button"
      aria-label="Ouvrir la bibliothèque"
    >

      <span class="room-name">
        Bibliothèque
      </span>

    </button>


    <!-- =========================
         SORTIR
         ========================= -->

    <button
      class="retour"
      id="retour"
      type="button"
    >
      Sortir
    </button>

  </section>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    const accueil =
      document.getElementById("accueil");

    const retour =
      document.getElementById("retour");

    const bibliotheque =
      document.getElementById(
        "bibliotheque-hotspot"
      );


    /* =========================
       ENTRER DANS NEIZH
       ========================= */

    accueil.addEventListener(
      "click",
      function () {

        document.body
          .classList
          .add("inside");

      }
    );


    /* =========================
       SORTIR
       ========================= */

    retour.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        document.body
          .classList
          .remove("inside");

      }
    );


    /* =========================
       BIBLIOTHÈQUE
       ========================= */

    bibliotheque.addEventListener(
      "click",
      function (event) {

        event.stopPropagation();

        alert(
          "Bienvenue dans la bibliothèque 📚"
        );

      }
    );

  </script>


</body>
</html>
